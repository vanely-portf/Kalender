<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#7c3aed" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Freundeskalender" />
  <title>Freundeskalender</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Kopfbereich -->
  <header class="hero">
    <div class="hero-zeile">
      <span class="logo">📅 Freundeskalender</span>
      <button id="profil-btn" class="profil-chip" type="button" aria-label="Profil bearbeiten">
        <span class="avatar klein" id="profil-punkt"></span>
        <span id="profil-name">Name eingeben</span>
      </button>
    </div>
    <p class="gruss" id="gruss">Hallo! 👋</p>
    <p class="gruss-unter" id="gruss-unter">Wann habt ihr alle Zeit?</p>
  </header>

  <main>
    <div id="modus-hinweis" class="hinweis" hidden></div>

    <!-- Kalender -->
    <section class="karte kalender" id="kalender-karte">
      <div class="monat-kopf">
        <button id="zurueck" class="nav-btn" type="button" aria-label="Vorheriger Monat">‹</button>
        <div class="monat-titel">
          <span id="jahr" class="jahr"></span>
          <span id="monat" class="monat"></span>
        </div>
        <button id="vor" class="nav-btn" type="button" aria-label="Nächster Monat">›</button>
      </div>
      <div class="wochentage" id="wochentage"></div>
      <div class="raster" id="raster"></div>
      <p class="raster-legende">
        <span class="mini alle"></span> alle verfügbar
        <span class="mini viele"></span> die meisten
        <span class="mini wenige"></span> wenige
      </p>
    </section>

    <!-- Auflistung / Tagesansicht -->
    <section class="karte">
      <div class="liste-kopf">
        <h2 id="liste-titel">Termine im Monat</h2>
        <button id="alle-btn" class="link-btn" type="button" hidden>Ganzer Monat</button>
      </div>
      <div id="tages-info" class="tages-info" hidden></div>
      <button id="neu-btn" class="primaer-btn" type="button" hidden>+ Eintrag für diesen Tag</button>
      <ul id="liste" class="liste"></ul>
    </section>

    <!-- Übersicht freie Tage -->
    <section class="karte">
      <h2>🏆 Beste Tage für ein Treffen</h2>
      <ul id="beste" class="beste"></ul>
    </section>

    <!-- Legende -->
    <section class="karte">
      <h2>🎨 Legende</h2>
      <h3>Personen</h3>
      <ul id="legende-personen" class="legende"></ul>
      <h3>Status</h3>
      <ul id="legende-status" class="legende"></ul>
    </section>
  </main>

  <!-- Profil-Dialog -->
  <dialog id="profil-dialog" class="sheet">
    <form id="profil-form" method="dialog" novalidate>
      <div class="griff"></div>
      <h2>Wer bist du? 👋</h2>
      <label>Name
        <input id="profil-input" type="text" maxlength="30" autocomplete="given-name" placeholder="z. B. Vanessa" />
      </label>
      <fieldset>
        <legend>Deine Farbe</legend>
        <div id="farb-auswahl" class="farben"></div>
      </fieldset>
      <p id="profil-fehler" class="fehler" role="alert"></p>
      <div class="aktionen">
        <button id="profil-abbrechen" type="button" class="sek-btn">Abbrechen</button>
        <button type="submit" class="primaer-btn">Speichern</button>
      </div>
    </form>
  </dialog>

  <!-- Eintrag-Dialog -->
  <dialog id="eintrag-dialog" class="sheet">
    <form id="eintrag-form" method="dialog" novalidate>
      <div class="griff"></div>
      <h2 id="eintrag-titel">Neuer Eintrag</h2>
      <p id="eintrag-datum" class="unter"></p>

      <fieldset>
        <legend>Status</legend>
        <div id="status-auswahl" class="status-chips"></div>
      </fieldset>

      <div class="zeile">
        <label>Von (Uhrzeit)
          <input id="von" type="time" />
        </label>
        <label>Bis (Uhrzeit)
          <input id="bis" type="time" />
        </label>
      </div>

      <label>Mehrere Tage? Bis Datum (optional)
        <input id="ende" type="date" />
      </label>

      <label>Notiz (optional)
        <input id="notiz" type="text" maxlength="80" placeholder="z. B. Zahnarzt, Geburtstag…" />
      </label>

      <p id="eintrag-fehler" class="fehler" role="alert"></p>

      <div class="aktionen">
        <button id="eintrag-abbrechen" type="button" class="sek-btn">Abbrechen</button>
        <button type="submit" class="primaer-btn">Speichern</button>
      </div>
    </form>
  </dialog>

  <div id="konfetti" class="konfetti" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
